name: Generate Knowledge Base Bundle

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bundle Repository
        run: python3 bundle_repo.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bcl-conversion-knowledge-base
          path: bcl_conversion_knowledge_base.txt
          retention-days: 14
